<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alice Commands Admin</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/admin/css/admin.css?v=13">
</head>
<body x-data="adminApp()" x-init="init()">
  <div class="status-bar" :class="serverStatusClass()">
    <span class="status-dot"></span>
    <span x-text="serverStatusLabel()"></span>
    <span class="status-meta" x-show="serverStatus.lastCheck">
      · проверка <span x-text="formatLastCheck(serverStatus.lastCheck)"></span>
    </span>
    <button type="button" class="status-refresh" @click="checkServerHealth()" :disabled="serverStatus.checking">↻</button>
  </div>

  <template x-if="!authenticated">
    <div class="login-page">
      <form class="login-card" @submit.prevent="login()">
        <h1>Alice Commands</h1>
        <p class="muted">Админка каталога</p>
        <p class="login-status-hint muted" x-show="!serverStatus.online && serverStatus.online !== null" x-text="serverStatus.error || 'Сервер недоступен — проверьте VPN/сеть'"></p>
        <label>Логин<input type="text" x-model="loginForm.username" required autocomplete="username"></label>
        <label>Пароль<input type="password" x-model="loginForm.password" required autocomplete="current-password"></label>
        <p class="error" x-show="error" x-text="error"></p>
        <button type="submit" :disabled="loading">Войти</button>
      </form>
    </div>
  </template>

  <template x-if="authenticated">
    <div class="layout">
      <nav class="sidebar">
        <h2>Админка</h2>
        <a href="#" @click.prevent="view='dashboard'" :class="{'active': view==='dashboard'}">Обзор</a>
        <a href="#" @click.prevent="view='categories'" :class="{'active': view==='categories'}">Категории</a>
        <a href="#" @click.prevent="view='category-visuals'; loadCategoryVisuals()" :class="{'active': view==='category-visuals'}">Оформление</a>
        <a href="#" @click.prevent="view='icon-library'; loadIconCatalog()" :class="{'active': view==='icon-library'}">Библиотека иконок</a>
        <a href="#" @click.prevent="view='command-groups'; loadCommandGroups()" :class="{'active': view==='command-groups'}">Группы команд</a>
        <a href="#" @click.prevent="view='commands'" :class="{'active': view==='commands'}">Команды</a>
        <a href="#" @click.prevent="view='scenarios'" :class="{'active': view==='scenarios'}">Шаблоны</a>
        <a href="#" @click.prevent="view='checklist'" :class="{'active': view==='checklist'}">Чеклист</a>
        <a href="#" @click.prevent="view='command-of-day'; loadCommandOfDay()" :class="{'active': view==='command-of-day'}">Команда дня</a>
        <a href="#" @click.prevent="view='affiliate'" :class="{'active': view==='affiliate'}">Партнёрские блоки</a>
        <a href="#" @click.prevent="view='feedback'; loadFeedback()" :class="{'active': view==='feedback'}">Отзывы</a>
        <a href="#" @click.prevent="view='command-reports'; loadCommandReports()" :class="{'active': view==='command-reports'}">Ошибки команд</a>
        <a href="#" @click.prevent="view='content'; loadPipeline()" :class="{'active': view==='content'}">Контент</a>
        <a href="#" @click.prevent="view='import'" :class="{'active': view==='import'}">Импорт bundle</a>
        <a href="#" @click.prevent="view='publish'; loadHistory()" :class="{'active': view==='publish'}">Публикация</a>
        <a href="#" @click.prevent="view='api'; loadApiDocs()" :class="{'active': view==='api'}">Справка API</a>
        <button class="logout" @click="logout()">Выйти</button>
      </nav>
      <main class="content">
        <section x-show="view==='dashboard'">
          <h1>Обзор</h1>
          <p class="muted section-note">Три слоя: <strong>опубликовано (live)</strong> — что видит app; <strong>draft</strong> — ваши правки; <strong>pipeline/editorial</strong> — тексты до попадания в draft.</p>
          <div class="cards" x-show="dashboard">
            <div class="card status-card" :class="serverStatusClass()">
              <h3>Сервер</h3>
              <p x-text="serverStatusLabel()"></p>
              <p class="muted" x-show="serverStatus.ready">
                DB: <span x-text="serverStatus.database"></span> · Storage: <span x-text="serverStatus.storage"></span>
              </p>
              <p class="muted">След. проверка через ~5 мин · <button type="button" class="link-btn" @click="checkServerHealth()">сейчас</button></p>
            </div>
            <div class="card">
              <h3>Опубликовано (live)</h3>
              <template x-if="dashboard?.live">
                <p>v<span x-text="dashboard.live.contentVersion"></span> · <span x-text="dashboard.live.publishedAt"></span></p>
              </template>
              <template x-if="!dashboard?.live"><p class="muted">Ещё не публиковали</p></template>
            </div>
            <div class="card">
              <h3>Черновик (draft)</h3>
              <p><span x-text="dashboard?.draft?.categoriesCount || 0"></span> категорий · <span x-text="dashboard?.draft?.commandGroupsCount || 0"></span> групп · <span x-text="dashboard?.draft?.commandsCount || 0"></span> команд</p>
              <p class="warning-inline" x-show="validationWarnings && (validationWarnings.orphan_commands?.length || validationWarnings.empty_groups?.length)">
                Группы: проверьте предупреждения на вкладке «Группы команд»
              </p>
              <p class="warning-inline" x-show="dashboard?.hasUnpublishedChanges">Draft bundle отличается от опубликованного</p>
              <p class="muted" x-show="dashboard && !dashboard?.hasUnpublishedChanges">Draft bundle совпадает с опубликованным</p>
            </div>
            <div class="card" x-show="dashboard?.inbox">
              <h3>Обращения из app</h3>
              <p>Открытые отзывы: <strong x-text="dashboard?.inbox?.open_feedback || 0"></strong></p>
              <p>Ошибки команд: <strong x-text="dashboard?.inbox?.open_command_reports || 0"></strong></p>
              <div class="actions">
                <button type="button" @click="view='feedback'; loadFeedback()">Отзывы</button>
                <button type="button" @click="view='command-reports'; loadCommandReports()">Reports</button>
              </div>
            </div>
          </div>
          <div class="actions">
            <button @click="previewBundle()" :disabled="!serverStatus.online">Скачать preview draft</button>
            <button class="primary" @click="view='publish'; loadHistory()">Перейти к публикации</button>
            <button @click="view='content'; loadPipeline()">Мастер обновления контента</button>
          </div>
          <p class="muted" x-show="previewJson">Preview также скачан как файл <code>preview-bundle.json</code>.</p>
        </section>

        <section x-show="view==='categories'">
          <h1>Категории</h1>
          <button @click="showCategoryForm()">+ Категория</button>
          <table>
            <thead><tr><th>#</th><th>ID</th><th>Название</th><th>В подборке</th><th></th></tr></thead>
            <tbody>
              <template x-for="c in categories" :key="c.id">
                <tr>
                  <td x-text="c.sort_order"></td>
                  <td x-text="c.id"></td>
                  <td x-text="c.title_ru"></td>
                  <td x-text="c.featured ? 'да' : ''"></td>
                  <td>
                    <button @click="moveCategory(c, -1)">↑</button>
                    <button @click="moveCategory(c, 1)">↓</button>
                    <button @click="editCategory(c)">Изменить</button>
                    <button class="danger" @click="deleteCategory(c.id)">Удалить</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <div class="modal" x-show="categoryForm" @click.self="categoryForm=null">
            <form class="modal-card" @submit.prevent="saveCategory()">
              <h3 x-text="categoryForm?.id ? 'Редактировать' : 'Новая категория'"></h3>
              <label>ID<input x-model="categoryForm.id" :readonly="categoryEditing" required pattern="[a-z0-9_]+"></label>
              <label>Название<input x-model="categoryForm.title_ru" required></label>
              <label>sort_order<input type="number" x-model.number="categoryForm.sort_order"></label>
              <label>source_url<input x-model="categoryForm.source_url" required type="url"></label>
              <label>icon_key<input x-model="categoryForm.icon_key" placeholder="fallback для offline"></label>
              <label>icon_url<input x-model="categoryForm.icon_url" type="url" placeholder="https://cdn.../icons/v1/slug.svg"></label>
              <div class="visual-row">
                <label>accent_color
                  <input type="color" :value="categoryForm.accent_color || '#1B6B5A'" @input="categoryForm.accent_color = $event.target.value.toUpperCase()">
                  <input x-model="categoryForm.accent_color" pattern="#[0-9A-Fa-f]{6}" placeholder="#RRGGBB">
                </label>
                <label>accent_color_dark
                  <input type="color" :value="categoryForm.accent_color_dark || '#4DB6A0'" @input="categoryForm.accent_color_dark = $event.target.value.toUpperCase()">
                  <input x-model="categoryForm.accent_color_dark" pattern="#[0-9A-Fa-f]{6}" placeholder="#RRGGBB">
                </label>
              </div>
              <template x-if="iconCatalog">
                <div class="icon-catalog">
                  <p class="muted">Пресеты цветов</p>
                  <div class="preset-chips">
                    <template x-for="p in iconCatalog.accent_presets" :key="p.name">
                      <button type="button" class="chip" @click="applyAccentPreset('category', p)" x-text="p.name"></button>
                    </template>
                  </div>
                  <p class="muted">Каталог иконок</p>
                  <div class="preset-chips">
                    <template x-for="icon in iconCatalog.icons" :key="icon.slug">
                      <button type="button" class="chip" @click="applyIconFromCatalog('category', icon)" x-text="icon.label_ru"></button>
                    </template>
                  </div>
                  <label>Загрузить SVG
                    <input type="file" accept=".svg,image/svg+xml" @change="uploadIconFile($event, 'category')">
                  </label>
                </div>
              </template>
              <div class="category-visual-preview" x-show="categoryForm.accent_color || categoryForm.icon_url">
                <div class="visual-preview-pair">
                  <span class="visual-swatch" :style="`background:${hexWithAlpha(categoryForm.accent_color, 0.18)}`">
                    <img x-show="categoryForm.icon_url" :src="categoryForm.icon_url" alt="" class="visual-icon-img" :style="categoryForm.accent_color ? `filter:none;color:${categoryForm.accent_color}` : ''">
                  </span>
                  <span class="visual-label">Light</span>
                </div>
                <div class="visual-preview-pair" x-show="categoryForm.accent_color_dark || categoryForm.accent_color">
                  <span class="visual-swatch visual-swatch-dark" :style="`background:${hexWithAlpha(categoryForm.accent_color_dark || categoryForm.accent_color, 0.22)}`">
                    <img x-show="categoryForm.icon_url" :src="categoryForm.icon_url" alt="" class="visual-icon-img">
                  </span>
                  <span class="visual-label">Dark</span>
                </div>
                <span x-text="categoryForm.title_ru || 'Превью'"></span>
              </div>
              <label>description<textarea x-model="categoryForm.description_ru"></textarea></label>
              <label><input type="checkbox" x-model="categoryForm.featured"> Показывать в подборке</label>
              <p class="error" x-show="formError" x-text="formError"></p>
              <div class="modal-actions">
                <button type="button" @click="categoryForm=null">Отмена</button>
                <button type="submit" class="primary" :disabled="saving || !serverStatus.online" x-text="saving ? 'Сохранение…' : 'Сохранить'"></button>
              </div>
            </form>
          </div>
        </section>

        <section x-show="view==='category-visuals'">
          <h1>Оформление категорий</h1>
          <p class="muted section-note">Цвета и иконки для карточек в приложении. После правок — <button type="button" class="link-btn" @click="view='publish'; loadHistory()">опубликуйте bundle</button>, чтобы app получила изменения.</p>
          <div class="actions" style="margin-bottom:1rem">
            <button type="button" @click="loadCategoryVisuals(true)">Обновить</button>
          </div>
          <table class="visuals-table" x-show="visualCategories.length">
            <thead>
              <tr>
                <th>Превью</th>
                <th>Категория</th>
                <th>icon_key</th>
                <th>icon_url</th>
                <th>Light</th>
                <th>Dark</th>
                <th>Иконка</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="c in visualCategories" :key="c.id">
                <tr>
                  <td>
                    <div class="category-visual-preview compact">
                      <span class="visual-swatch" :style="`background:${hexWithAlpha(c.accent_color, 0.18)}`">
                        <img x-show="c.icon_url" :src="c.icon_url" alt="" class="visual-icon-img">
                      </span>
                    </div>
                  </td>
                  <td>
                    <strong x-text="c.title_ru"></strong>
                    <div class="muted small" x-text="c.id"></div>
                  </td>
                  <td><input class="compact-input" x-model="c.icon_key" placeholder="offline key"></td>
                  <td><input class="compact-input wide" x-model="c.icon_url" type="url" placeholder="https://cdn.../slug.svg"></td>
                  <td class="color-cell">
                    <input type="color" :value="c.accent_color || '#1B6B5A'" @input="c.accent_color = $event.target.value.toUpperCase()">
                    <input class="compact-input" x-model="c.accent_color" pattern="#[0-9A-Fa-f]{6}">
                  </td>
                  <td class="color-cell">
                    <input type="color" :value="c.accent_color_dark || '#4DB6A0'" @input="c.accent_color_dark = $event.target.value.toUpperCase()">
                    <input class="compact-input" x-model="c.accent_color_dark" pattern="#[0-9A-Fa-f]{6}">
                  </td>
                  <td>
                    <select class="compact-input" @change="applyIconToVisualCategory(c, $event.target.value); $event.target.value=''">
                      <option value="">— выбрать —</option>
                      <template x-for="icon in iconCatalog?.icons || []" :key="icon.slug">
                        <option :value="icon.slug" x-text="icon.label_ru"></option>
                      </template>
                    </select>
                  </td>
                  <td>
                    <button type="button" class="primary" @click="saveCategoryVisual(c)" :disabled="saving || !serverStatus.online">Сохранить</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <p class="muted" x-show="!visualCategories.length">Загрузка категорий…</p>
          <template x-if="iconCatalog?.accent_presets?.length">
            <div class="icon-catalog" style="margin-top:1.5rem">
              <p class="muted">Быстрые пресеты цветов (клик — применить к первой категории в списке)</p>
              <div class="preset-chips">
                <template x-for="p in iconCatalog.accent_presets" :key="p.name">
                  <button type="button" class="chip" @click="applyPresetToVisualCategory(p)" x-text="p.name"></button>
                </template>
              </div>
            </div>
          </template>
        </section>

        <section x-show="view==='icon-library'">
          <h1>Библиотека иконок</h1>
          <p class="muted section-note">SVG на диске сервера, URL строится из <code x-text="iconCatalog?.public_base_url || 'ICON_PUBLIC_BASE_URL'"></code>/icons/v1/{slug}.svg. На staging это <strong>staging-api</strong>; prod — <strong>cdn</strong> после DNS.</p>
          <label>Загрузить SVG
            <input type="file" accept=".svg,image/svg+xml" @change="uploadIconFile($event, 'library')">
          </label>
          <table x-show="iconCatalog?.icons?.length">
            <thead><tr><th>Slug</th><th>Название</th><th>URL</th><th></th></tr></thead>
            <tbody>
              <template x-for="icon in iconCatalog?.icons || []" :key="icon.slug">
                <tr>
                  <td x-text="icon.slug"></td>
                  <td x-text="icon.label_ru"></td>
                  <td><a :href="icon.url" target="_blank" rel="noopener" x-text="icon.url"></a></td>
                  <td><img :src="icon.url" alt="" class="visual-icon-img" style="width:28px;height:28px"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </section>

        <section x-show="view==='command-groups'">
          <h1>Группы команд</h1>
          <p class="muted section-note">Смысловые секции внутри категории (Свет, Климат…). Порядок — ▲/▼ или sort_order.</p>
          <label>Категория
            <select x-model="groupFilter" @change="loadCommandGroups()">
              <template x-for="c in categories" :key="c.id">
                <option :value="c.id" x-text="c.title_ru"></option>
              </template>
            </select>
          </label>
          <button @click="showGroupForm()">+ Группа</button>
          <button type="button" @click="loadValidationWarnings()">Обновить предупреждения</button>
          <div class="warning-inline" x-show="validationWarnings?.empty_groups?.length">
            Пустые группы: <span x-text="validationWarnings.empty_groups.join(', ')"></span>
          </div>
          <div class="warning-inline" x-show="validationWarnings?.icon_url_without_icon_key?.length">
            icon_url без icon_key: <span x-text="validationWarnings.icon_url_without_icon_key.join(', ')"></span>
          </div>
          <div class="warning-inline" x-show="validationWarnings?.low_contrast_visuals?.length">
            Низкий контраст accent: <span x-text="validationWarnings.low_contrast_visuals.join(', ')"></span>
          </div>
          <div class="warning-inline" x-show="validationWarnings?.orphan_commands?.length">
            Команды без группы: <span x-text="formatIdList(validationWarnings.orphan_commands, 12)"></span>
          </div>
          <table>
            <thead><tr><th>#</th><th>ID</th><th>Название</th><th>Команд</th><th></th></tr></thead>
            <tbody>
              <template x-for="g in commandGroups" :key="g.id">
                <tr>
                  <td x-text="g.sort_order"></td>
                  <td x-text="g.id"></td>
                  <td x-text="g.title_ru"></td>
                  <td x-text="commandsInGroup(g.id).length"></td>
                  <td>
                    <button @click="moveCommandGroup(g, -1)">↑</button>
                    <button @click="moveCommandGroup(g, 1)">↓</button>
                    <button @click="editGroup(g)">Изменить</button>
                    <button class="danger" @click="deleteGroup(g.id)">Удалить</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <div class="modal" x-show="groupForm" @click.self="groupForm=null">
            <form class="modal-card wide" @submit.prevent="saveGroup()">
              <h3 x-text="groupEditing ? 'Редактировать группу' : 'Новая группа'"></h3>
              <label>ID<input x-model="groupForm.id" :readonly="groupEditing" required pattern="[a-z0-9_]+"></label>
              <label>Категория
                <select x-model="groupForm.category_id" required>
                  <template x-for="c in categories" :key="c.id">
                    <option :value="c.id" x-text="c.title_ru"></option>
                  </template>
                </select>
              </label>
              <label>Название<input x-model="groupForm.title_ru" required></label>
              <label>sort_order<input type="number" x-model.number="groupForm.sort_order"></label>
              <label>icon_key<input x-model="groupForm.icon_key" placeholder="fallback"></label>
              <label><input type="checkbox" x-model="groupForm.inheritVisuals" @change="toggleGroupVisualInherit()"> Наследовать иконку/цвет от категории</label>
              <template x-if="!groupForm.inheritVisuals">
                <div>
                  <label>icon_url<input x-model="groupForm.icon_url" type="url"></label>
                  <div class="visual-row">
                    <label>accent_color
                      <input type="color" :value="groupForm.accent_color || '#1B6B5A'" @input="groupForm.accent_color = $event.target.value.toUpperCase()">
                      <input x-model="groupForm.accent_color">
                    </label>
                    <label>accent_color_dark
                      <input type="color" :value="groupForm.accent_color_dark || '#4DB6A0'" @input="groupForm.accent_color_dark = $event.target.value.toUpperCase()">
                      <input x-model="groupForm.accent_color_dark">
                    </label>
                  </div>
                  <div class="category-visual-preview" x-show="groupForm.accent_color || groupForm.icon_url">
                    <span class="visual-swatch" :style="`background:${hexWithAlpha(groupForm.accent_color, 0.18)}`">
                      <img x-show="groupForm.icon_url" :src="groupForm.icon_url" alt="" class="visual-icon-img">
                    </span>
                    <span x-text="groupForm.title_ru || 'Группа'"></span>
                  </div>
                  <template x-if="iconCatalog">
                    <div class="icon-catalog">
                      <div class="preset-chips">
                        <template x-for="icon in iconCatalog.icons" :key="icon.slug">
                          <button type="button" class="chip" @click="applyIconFromCatalog('group', icon)" x-text="icon.label_ru"></button>
                        </template>
                      </div>
                      <label>Загрузить SVG
                        <input type="file" accept=".svg,image/svg+xml" @change="uploadIconFile($event, 'group')">
                      </label>
                    </div>
                  </template>
                </div>
              </template>
              <label>description<textarea x-model="groupForm.description_ru"></textarea></label>
              <label><input type="checkbox" x-model="groupForm.featured"> featured</label>
              <label>preview_command_ids (через запятую)
                <input x-model="groupForm.previewIdsText" placeholder="cmd_id1, cmd_id2">
              </label>
              <p class="error" x-show="formError" x-text="formError"></p>
              <div class="modal-actions">
                <button type="button" @click="groupForm=null">Отмена</button>
                <button type="submit" class="primary" :disabled="saving || !serverStatus.online">Сохранить</button>
              </div>
            </form>
          </div>
        </section>

        <section x-show="view==='commands'">
          <h1>Команды</h1>
          <label>Категория
            <select x-model="commandFilter" @change="loadCommands()">
              <option value="">Все</option>
              <template x-for="c in categories" :key="c.id">
                <option :value="c.id" x-text="c.title_ru"></option>
              </template>
            </select>
          </label>
          <button @click="showCommandForm()">+ Команда</button>
          <template x-if="selectedCommandIds.length">
            <label>Назначить группу
              <select x-model="bulkGroupId">
                <option value="">— без группы —</option>
                <template x-for="g in commandGroupsForFilter()" :key="g.id">
                  <option :value="g.id" x-text="g.title_ru"></option>
                </template>
              </select>
              <button type="button" @click="bulkAssignGroup()">Применить (<span x-text="selectedCommandIds.length"></span>)</button>
            </label>
          </template>
          <table>
            <thead><tr><th></th><th>ID</th><th>Название</th><th>Группа</th><th>#</th><th></th></tr></thead>
            <tbody>
              <template x-for="cmd in commands" :key="cmd.id">
                <tr>
                  <td><input type="checkbox" :value="cmd.id" @change="toggleCommandSelect(cmd.id, $event.target.checked)"></td>
                  <td x-text="cmd.id"></td>
                  <td x-text="cmd.title_ru"></td>
                  <td x-text="cmd.group_id || '—'"></td>
                  <td x-text="cmd.sort_order ?? '—'"></td>
                  <td>
                    <button @click="editCommand(cmd)">Изменить</button>
                    <button class="danger" @click="deleteCommand(cmd.id)">Удалить</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <div class="modal" x-show="commandForm" @click.self="commandForm=null">
            <form class="modal-card wide" @submit.prevent="saveCommand()">
              <h3 x-text="commandEditing ? 'Редактировать команду' : 'Новая команда'"></h3>
              <label>ID<input x-model="commandForm.id" :readonly="commandEditing" required></label>
              <label>Категория
                <select x-model="commandForm.category_id" required>
                  <template x-for="c in categories" :key="c.id">
                    <option :value="c.id" x-text="c.title_ru"></option>
                  </template>
                </select>
              </label>
              <label>Название<input x-model="commandForm.title_ru" required></label>
              <label>Фразы (по одной на строку)<textarea x-model="commandForm.phrasesText" rows="4" required></textarea></label>
              <label>Эффект<textarea x-model="commandForm.effect_description_ru" required></textarea></label>
              <label>source_url<input x-model="commandForm.source_url" type="url" required></label>
              <label><input type="checkbox" x-model="commandForm.requires_alice_word"> Требует «Алиса»</label>
              <label><input type="checkbox" x-model="commandForm.requires_plus"> Требует Plus</label>
              <label>tags (через запятую)<input x-model="commandForm.tagsText"></label>
              <label>Группа
                <select x-model="commandForm.group_id">
                  <option value="">— без группы —</option>
                  <template x-for="g in groupsForCategory(commandForm.category_id)" :key="g.id">
                    <option :value="g.id" x-text="g.title_ru"></option>
                  </template>
                </select>
              </label>
              <label>sort_order в группе<input type="number" x-model.number="commandForm.sort_order"></label>
              <label>variant_label_ru<input x-model="commandForm.variant_label_ru" placeholder="короткая подпись в списке"></label>
              <label><input type="checkbox" x-model="commandForm.is_primary_in_group"> primary в группе</label>
              <label>search_aliases (через запятую)<input x-model="commandForm.aliasesText"></label>
              <p class="error" x-show="formError" x-text="formError"></p>
              <div class="modal-actions">
                <button type="button" @click="commandForm=null">Отмена</button>
                <button type="submit" class="primary" :disabled="saving || !serverStatus.online" x-text="saving ? 'Сохранение…' : 'Сохранить в draft'"></button>
              </div>
            </form>
          </div>
        </section>

        <section x-show="view==='scenarios'">
          <h1>Шаблоны сценариев</h1>
          <button @click="showScenarioForm()">+ Шаблон</button>
          <table>
            <thead><tr><th>ID</th><th>Название</th><th>trigger</th><th></th></tr></thead>
            <tbody>
              <template x-for="s in scenarios" :key="s.id">
                <tr>
                  <td x-text="s.id"></td>
                  <td x-text="s.title_ru"></td>
                  <td x-text="s.trigger_ru"></td>
                  <td>
                    <button @click="editScenario(s)">Изменить</button>
                    <button class="danger" @click="deleteScenario(s.id)">Удалить</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <div class="modal" x-show="scenarioForm" @click.self="scenarioForm=null">
            <form class="modal-card wide" @submit.prevent="saveScenario()">
              <h3 x-text="scenarioEditing ? 'Редактировать шаблон' : 'Новый шаблон'"></h3>
              <label>ID<input x-model="scenarioForm.id" :readonly="scenarioEditing" required></label>
              <label>Название<input x-model="scenarioForm.title_ru" required></label>
              <label>trigger_ru<input x-model="scenarioForm.trigger_ru"></label>
              <label>actions (по строке)<textarea x-model="scenarioForm.actionsText" rows="3"></textarea></label>
              <label>example_phrases<textarea x-model="scenarioForm.examplesText" rows="3"></textarea></label>
              <label>audience<input x-model="scenarioForm.audience"></label>
              <label>source_url<input x-model="scenarioForm.source_url" type="url" required></label>
              <p class="error" x-show="formError" x-text="formError"></p>
              <div class="modal-actions">
                <button type="button" @click="scenarioForm=null">Отмена</button>
                <button type="submit" class="primary" :disabled="saving || !serverStatus.online" x-text="saving ? 'Сохранение…' : 'Сохранить'"></button>
              </div>
            </form>
          </div>
        </section>

        <section x-show="view==='checklist'">
          <h1>Чеклист УД</h1>
          <button @click="saveChecklist()" :disabled="saving || !serverStatus.online">Сохранить порядок</button>
          <table>
            <thead><tr><th>#</th><th>id</th><th>command_id</th><th>hint</th></tr></thead>
            <tbody>
              <template x-for="(item, idx) in checklist" :key="item.id">
                <tr>
                  <td><input type="number" x-model.number="item.order" min="1" max="10" style="width:4rem"></td>
                  <td x-text="item.id"></td>
                  <td><input x-model="item.command_id"></td>
                  <td><input x-model="item.hint_ru"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </section>

        <section x-show="view==='command-of-day'">
          <h1>Команда дня</h1>
          <p class="muted section-note">Настройка editorial-объекта в bundle. Save — только draft; publish — на вкладке «Публикация».</p>
          <template x-if="commandOfDayForm">
            <div class="card">
              <div class="form-row">
                <label>Режим</label>
                <select x-model="commandOfDayForm.mode">
                  <option value="manual">Ручной</option>
                  <option value="auto">Авто (по категории)</option>
                </select>
              </div>
              <template x-if="commandOfDayForm.mode === 'manual'">
                <div class="form-row">
                  <label>Команда (id)</label>
                  <input x-model="commandOfDayForm.command_id" list="command-of-day-ids" placeholder="sh_light_on">
                  <datalist id="command-of-day-ids">
                    <template x-for="c in allCommands" :key="c.id">
                      <option :value="c.id" x-text="c.title_ru"></option>
                    </template>
                  </datalist>
                </div>
              </template>
              <template x-if="commandOfDayForm.mode === 'auto'">
                <div class="form-row">
                  <label>Категория</label>
                  <select x-model="commandOfDayForm.auto_category_id">
                    <template x-for="cat in categories" :key="cat.id">
                      <option :value="cat.id" x-text="cat.title_ru + ' (' + cat.id + ')'"></option>
                    </template>
                  </select>
                  <p class="muted" x-show="commandOfDay?.pool_size != null">Команд в пуле: <span x-text="commandOfDay.pool_size"></span></p>
                </div>
                <div class="form-row">
                  <label>Seed</label>
                  <input type="number" x-model.number="commandOfDayForm.auto_seed" min="1" style="width:6rem">
                </div>
              </template>
              <div class="form-row" x-show="commandOfDay?.preview_today">
                <strong>Сегодня (Europe/Moscow):</strong>
                <span x-text="commandOfDay.preview_today?.title_ru"></span>
                <span class="muted" x-text="commandOfDay.preview_today?.phrase"></span>
                <span class="muted">· id: <span x-text="commandOfDay.preview_today?.command_id"></span></span>
              </div>
              <div class="actions">
                <button @click="saveCommandOfDay()" :disabled="saving || !serverStatus.online">Сохранить draft</button>
              </div>
            </div>
          </template>
          <p class="muted" x-show="!commandOfDayForm && !commandOfDayLoading">Загрузите каталог — нужны категории и команды.</p>
        </section>

        <section x-show="view==='affiliate'">
          <h1>Партнёрские блоки</h1>
          <button @click="showAffiliateForm()">+ Блок</button>
          <template x-for="b in affiliate" :key="b.id">
            <div class="card affiliate-card">
              <div class="affiliate-card-head">
                <div>
                  <strong x-text="b.title_ru"></strong>
                  <p class="muted affiliate-meta">
                    <span x-text="b.context_category_id || 'без категории'"></span>
                    · ERID: <span x-text="b.erid || '—'"></span>
                    · товаров: <span x-text="(b.products || []).length"></span>
                  </p>
                </div>
                <div class="actions affiliate-card-actions">
                  <button @click="editAffiliate(b)">Изменить</button>
                  <button class="danger" @click="deleteAffiliate(b.id)">Удалить</button>
                </div>
              </div>
              <ul class="affiliate-product-list" x-show="(b.products || []).length">
                <template x-for="p in b.products" :key="p.title_ru + p.market_url">
                  <li>
                    <span x-text="p.title_ru"></span>
                    <a :href="p.market_url" target="_blank" rel="noopener noreferrer" x-text="p.market_url"></a>
                    <span class="muted" x-show="p.price_hint" x-text="p.price_hint"></span>
                  </li>
                </template>
              </ul>
            </div>
          </template>
          <p class="muted" x-show="!affiliate.length">Нет блоков</p>
          <div class="modal" x-show="affiliateForm" @click.self="affiliateForm=null">
            <form class="modal-card wide" @submit.prevent="saveAffiliate()">
              <h3 x-text="affiliateEditing ? 'Редактировать блок' : 'Новый блок'"></h3>
              <label>ID<input x-model="affiliateForm.id" :readonly="affiliateEditing" required></label>
              <label>Название<input x-model="affiliateForm.title_ru" required></label>
              <label>context_category_id<input x-model="affiliateForm.context_category_id"></label>
              <label>ERID<input x-model="affiliateForm.erid" required placeholder="Например: 2Vtzq..."></label>
              <label>advertiser_name<input x-model="affiliateForm.advertiser_name" required placeholder="Юрлицо или ИП рекламодателя"></label>
              <div class="affiliate-products-editor">
                <div class="affiliate-products-head">
                  <strong>Товары и партнёрские ссылки</strong>
                  <button type="button" @click="addAffiliateProduct()">+ Товар</button>
                </div>
                <p class="muted">Ссылка должна начинаться с <code>https://</code>. Эти URL попадают в app сразу после сохранения блока.</p>
                <template x-for="(product, idx) in affiliateForm.products" :key="idx">
                  <div class="affiliate-product-editor">
                    <label>Название товара<input x-model="product.title_ru" required></label>
                    <label>Партнёрская ссылка<input x-model="product.market_url" type="url" required placeholder="https://..." inputmode="url"></label>
                    <label>Цена / подсказка<input x-model="product.price_hint" placeholder="от 990 ₽"></label>
                    <button type="button" class="danger" @click="removeAffiliateProduct(idx)" :disabled="affiliateForm.products.length <= 1">Удалить товар</button>
                  </div>
                </template>
              </div>
              <p class="error" x-show="formError" x-text="formError"></p>
              <div class="modal-actions">
                <button type="button" @click="affiliateForm=null">Отмена</button>
                <button type="submit" class="primary" :disabled="saving || !serverStatus.online" x-text="saving ? 'Сохранение…' : 'Сохранить'"></button>
              </div>
            </form>
          </div>
        </section>

        <section x-show="view==='publish'">
          <h1>Публикация</h1>
          <p class="muted section-note">Публикует текущий <strong>draft bundle</strong> как новую live-версию для app. Editorial/pipeline сами по себе в app не попадают — только через draft.</p>
          <p x-show="dashboard?.live">Текущая live-версия: v<span x-text="dashboard.live.contentVersion"></span></p>
          <p class="warning-inline" x-show="dashboard?.hasUnpublishedChanges">Draft отличается от опубликованного — можно публиковать.</p>
          <p class="muted" x-show="dashboard && !dashboard?.hasUnpublishedChanges">Draft совпадает с опубликованным — публикация не нужна.</p>
          <div class="actions">
            <button class="primary" @click="doPublish()" :disabled="loading || !dashboard?.hasUnpublishedChanges">Опубликовать draft → live</button>
            <button @click="previewBundle()">Скачать preview draft</button>
          </div>
          <h2>История публикаций</h2>
          <table>
            <thead><tr><th>v</th><th>Дата</th><th>admin</th><th></th></tr></thead>
            <tbody>
              <template x-for="h in history" :key="h.id">
                <tr>
                  <td x-text="h.contentVersion"></td>
                  <td x-text="h.publishedAt"></td>
                  <td x-text="h.adminUsername"></td>
                  <td><button @click="rollback(h.contentVersion)">Откатить live</button></td>
                </tr>
              </template>
            </tbody>
          </table>
        </section>

        <section x-show="view==='import'">
          <h1>Импорт bundle JSON</h1>
          <div class="info-banner">
            <strong>Не editorial JSON.</strong> Сюда загружают content bundle (<code>categories</code>, <code>commands</code>, …).
            Для правок title/effect используйте раздел <button type="button" class="link-btn" @click="view='content'; loadPipeline()">Контент → Редактор текстов</button>.
          </div>
          <p class="muted">Импорт пишет в draft PostgreSQL. App увидит изменения только после публикации draft → live.</p>
          <div class="actions import-top-actions">
            <button type="button" class="primary" @click="view='content'; loadPipeline()">Мастер обновления (Контент)</button>
          </div>

          <div class="import-panel card">
            <h2>1. Режим</h2>
            <div class="import-modes">
              <label class="import-mode-option">
                <input type="radio" name="importMode" value="merge" x-model="importMode" @change="refreshImportPreview()">
                <div class="import-mode-text">
                  <strong>Объединить (merge)</strong>
                  <span class="muted">Добавить новые id и обновить существующие. Остальной draft не удаляется.</span>
                </div>
              </label>
              <label class="import-mode-option">
                <input type="radio" name="importMode" value="replace" x-model="importMode" @change="refreshImportPreview()">
                <div class="import-mode-text">
                  <strong>Заменить всё (replace)</strong>
                  <span class="muted">Заменить каталог bundle (категории, команды, шаблоны, чеклист). Партнёрские блоки не затрагиваются.</span>
                </div>
              </label>
            </div>
            <p class="muted">Режим <code>sync</code> (как <code>push-draft.ps1</code>) доступен только через скрипт на ПК, не в этой форме.</p>

            <h2>2. Файл</h2>
            <div class="import-file-row">
              <label class="import-file-picker">
                <input type="file" accept=".json,application/json" @change="selectImportFile($event)">
                <span class="import-file-button">Выбрать JSON…</span>
              </label>
              <button type="button" x-show="importDraft" @click="clearImportFile()">Сбросить</button>
            </div>

            <div class="import-preview" x-show="importDraft" x-cloak>
              <p class="import-file-meta">
                <strong x-text="importDraft?.name"></strong>
                · <span x-text="formatBytes(importDraft?.sizeBytes || 0)"></span>
                <template x-if="importDraft?.preview?.schemaVersion != null">
                  · schema v<span x-text="importDraft.preview.schemaVersion"></span>
                </template>
              </p>

              <p class="import-parse-error" x-show="importParseError" x-text="importParseError"></p>

              <div x-show="importDraft?.preview">
                <div class="import-warning" x-show="importMode === 'replace' && !importParseError">
                  Текущий каталог bundle будет заменён. Сейчас в draft:
                  <span x-text="dashboard?.draft?.categoriesCount || 0"></span> кат.,
                  <span x-text="dashboard?.draft?.commandsCount || 0"></span> команд,
                  <span x-text="dashboard?.draft?.scenarioTemplatesCount || 0"></span> шаблонов,
                  <span x-text="dashboard?.draft?.checklistItemsCount || 0"></span> пунктов чеклиста.
                  Affiliate не меняется.
                </div>

                <dl class="import-summary" x-show="!importParseError">
                  <template x-for="row in importSummaryRows()" :key="row.label">
                    <div class="import-summary-row">
                      <dt x-text="row.label"></dt>
                      <dd x-text="row.value"></dd>
                    </div>
                  </template>
                </dl>

                <div class="import-diff" x-show="publishedDiff && !importParseError">
                  <h3>Diff: файл vs опубликованное (live)</h3>
                  <p class="muted">Показывает, что изменится относительно текущего live bundle, если опубликовать этот файл как новый draft и затем выполнить публикацию.</p>
                  <p class="import-diff-summary" x-show="publishedDiffSummaryText()" x-text="publishedDiffSummaryText()"></p>
                  <p class="muted" x-show="importPreviewLoading">Загрузка diff…</p>
                  <div class="import-diff-filters" x-show="publishedDiff && !importPreviewLoading">
                    <label><input type="radio" value="all" x-model="diffFilter"> Все</label>
                    <label><input type="radio" value="added" x-model="diffFilter"> Добавлено</label>
                    <label><input type="radio" value="changed" x-model="diffFilter"> Изменено</label>
                    <label><input type="radio" value="removed" x-model="diffFilter"> Удалено</label>
                    <label class="import-needs-review"><input type="checkbox" x-model="diffNeedsReviewOnly"> только needs_review</label>
                  </div>
                  <template x-for="sec in publishedDiffSections()" :key="sec.key">
                    <div class="import-diff-block" x-show="filteredDiffItems(sec.section).length > 0">
                      <p><strong x-text="sec.label"></strong>:
                        +<span x-text="sec.section.summary.added"></span> /
                        ~<span x-text="sec.section.summary.changed"></span> /
                        −<span x-text="sec.section.summary.removed"></span>
                      </p>
                      <template x-for="item in filteredDiffItems(sec.section)" :key="item.id">
                        <details class="import-diff-item">
                          <summary>
                            <span class="diff-badge" :class="'diff-' + item.change" x-text="changeLabel(item.change)"></span>
                            <span x-text="item.title_ru || item.id"></span>
                            <span class="muted" x-show="item.category_id" x-text="'(' + item.category_id + ')'"></span>
                          </summary>
                          <ul class="import-field-diffs">
                            <template x-for="fd in diffFieldEntries(item)" :key="fd.field">
                              <li>
                                <code x-text="fd.field"></code>:
                                <span class="diff-old" x-text="fd.old || '—'"></span>
                                →
                                <span class="diff-new" x-text="fd.new || '—'"></span>
                              </li>
                            </template>
                          </ul>
                        </details>
                      </template>
                    </div>
                  </template>
                </div>

                <div class="import-diff import-diff-draft" x-show="importMode === 'merge' && importDraft?.preview?.mergeDiff && !importParseError">
                  <h3>Изменения в draft (merge)</h3>
                  <template x-for="block in importDiffBlocks()" :key="block.label">
                    <div class="import-diff-block" x-show="block.total > 0">
                      <p><strong x-text="block.label"></strong>: <span x-text="block.text"></span></p>
                      <p class="muted import-id-list" x-show="block.addIds.length">
                        Новые id: <span x-text="formatIdList(block.addIds)"></span>
                      </p>
                      <p class="muted import-id-list" x-show="block.updateIds.length">
                        Обновятся: <span x-text="formatIdList(block.updateIds)"></span>
                      </p>
                    </div>
                  </template>
                  <p class="muted" x-show="!importDiffHasChanges()">Нет пересечений по id — всё будет добавлено как новое.</p>
                </div>
              </div>

              <div class="import-actions">
                <button type="button" class="primary" @click="doImport()"
                  :disabled="importLoading || !!importParseError || !importDraft?.text || !serverStatus.online"
                  x-text="importLoading ? 'Импорт…' : 'Импортировать bundle в draft'"></button>
              </div>
            </div>

            <p class="muted" x-show="!importDraft">Файл не выбран. После выбора появится превью и кнопка импорта.</p>
          </div>
        </section>

        <section x-show="view==='content'" x-cloak>
          <h1>Обновление контента</h1>
          <p class="muted">Publish автоматически не выполняется. Следуйте шагам сверху вниз: pipeline → editorial → diff draft vs опубликованное → публикация.</p>

          <div class="card wizard-status" x-show="pipeline && !pipelineLoading">
            <div class="wizard-status-grid">
              <div>
                <span class="wizard-label">Опубликовано (live)</span>
                <template x-if="pipeline?.live?.contentVersion">
                  <p class="wizard-value">v<span x-text="pipeline.live.contentVersion"></span>
                    · <span x-text="pipeline.live.publishedAt"></span></p>
                </template>
                <template x-if="!pipeline?.live?.contentVersion">
                  <p class="muted wizard-value">Ещё не публиковали</p>
                </template>
              </div>
              <div>
                <span class="wizard-label">Черновик (draft)</span>
                <p class="wizard-value">
                  <span x-text="pipeline?.draft?.commandsCount || 0"></span> команд
                  · <span x-text="pipeline?.draft?.categoriesCount || 0"></span> кат.
                </p>
                <p class="warning-inline" x-show="pipeline?.draft?.needsReviewCount > 0">
                  <span x-text="pipeline.draft.needsReviewCount"></span> с тегом needs_review в draft
                </p>
              </div>
              <div>
                <span class="wizard-label">Pipeline (до draft)</span>
                <p class="wizard-value">
                  inventory <span x-text="pipeline?.pipeline?.inventory_count ?? '—'"></span>
                  · approved editorial <span x-text="pipeline?.pipeline?.editorial_approved ?? '—'"></span>
                  · очередь <span x-text="pipeline?.pipeline?.open_queue ?? contentQueue.length"></span>
                </p>
              </div>
              <div>
                <span class="wizard-label">Статус draft bundle</span>
                <p class="wizard-value" :class="pipeline?.hasUnpublishedChanges ? 'text-warn' : 'text-ok'"
                  x-text="pipeline?.hasUnpublishedChanges ? 'Draft bundle отличается от опубликованного' : 'Draft bundle совпадает с опубликованным'"></p>
              </div>
            </div>
          </div>

          <div class="card" x-show="pipelineLoading"><p class="muted">Загрузка статуса…</p></div>

          <ol class="wizard-steps">
            <li class="wizard-step">
              <div class="step-head">
                <span class="step-num">1</span>
                <h2>На вашем ПК — обновить каталог</h2>
              </div>
              <p>Ярлыки в папке <strong>Alice Commands</strong> на рабочем столе. Запуск: <strong>Alice 1 - Obnovit katalog</strong>.</p>
              <p class="muted">Установка один раз: <code>scripts/desktop/Ustanovit-yarlyki.bat</code>. Pipeline ярлыки не создаёт.</p>
              <details class="wizard-details">
                <summary>Запуск из репозитория (если ярлыков ещё нет на столе)</summary>
                <ul class="pipeline-list">
                  <li>
                    <code x-text="pipeline?.localScript || 'scripts/update-content.ps1'"></code>
                    <button type="button" @click="copyText('.\\' + (pipeline?.localScript || 'scripts/update-content.ps1'))">Копировать</button>
                    <span class="muted"> — полный pipeline + ярлыки на рабочий стол</span>
                  </li>
                  <li>
                    <code x-text="pipeline?.shortcutsScript || 'scripts/desktop/1-Obnovit-katalog.bat'"></code>
                    <button type="button" @click="copyText(pipeline?.shortcutsScript || 'scripts\\desktop\\1-Obnovit-katalog.bat')">Копировать</button>
                    <span class="muted"> — то же через bat</span>
                  </li>
                </ul>
              </details>
              <details class="wizard-details">
                <summary>Дополнительно: PowerShell вручную</summary>
                <ul class="pipeline-list">
                  <li>
                    <code x-text="pipeline?.localScript || 'scripts/update-content.ps1'"></code>
                    <button type="button" @click="copyText('.\\' + (pipeline?.localScript || 'scripts/update-content.ps1'))">Копировать</button>
                    <span class="muted"> — полный pipeline</span>
                  </li>
                  <li>
                    <code x-text="pipeline?.pushScript || 'scripts/push-draft.ps1 -Mode sync'"></code>
                    <button type="button" @click="copyText('.\\' + (pipeline?.pushScript || 'scripts/push-draft.ps1 -Mode sync'))">Копировать</button>
                    <span class="muted"> — только push</span>
                  </li>
                </ul>
              </details>
            </li>

            <li class="wizard-step" :class="{'step-active': pipeline?.hasUnpublishedChanges, 'step-done': pipeline && !pipeline?.hasUnpublishedChanges && pipeline?.live?.contentVersion}">
              <div class="step-head">
                <span class="step-num">2</span>
                <h2>Проверить, что draft обновился</h2>
              </div>
              <p x-show="pipeline?.hasUnpublishedChanges">Draft bundle отличается от опубликованного — можно переходить к вычитке (шаг 3).</p>
              <p class="muted" x-show="pipeline && !pipeline?.hasUnpublishedChanges">
                После push с ПК здесь появится «Draft bundle отличается от опубликованного». Если push ещё не делали — выполните шаг 1.
              </p>
              <button type="button" @click="loadPipeline()" :disabled="pipelineLoading">Обновить статус</button>
            </li>

            <li class="wizard-step" :class="{'step-active': editorialReview?.total > 0}">
              <div class="step-head">
                <span class="step-num">3</span>
                <h2>Редактор текстов (все изменения)</h2>
              </div>
              <p class="muted">Просмотр и правка title/effect. Экспорт JSON → правка в ChatGPT/Cursor → <strong>Загрузить JSON</strong> сюда (editorial, не bundle).</p>
              <p class="muted section-note">Колонки: <strong>Опубликовано</strong> — live bundle; <strong>Черновик</strong> — draft PostgreSQL; <strong>Правка</strong> — pipeline editorial (источник для rebuild draft).</p>
              <div class="editorial-toolbar actions">
                <button type="button" class="primary" @click="loadEditorialReview()" :disabled="editorialReviewLoading"
                  x-text="editorialReviewLoading ? 'Загрузка…' : 'Обновить список'"></button>
                <button type="button" class="primary" @click="saveEditorialReview()" :disabled="editorialReviewSaving || !editorialReview?.records?.length">
                  <span x-text="editorialReviewSaving ? 'Сохранение…' : 'Сохранить правки'"></span>
                </button>
                <button type="button" @click="exportEditorialReview()" :disabled="editorialReviewLoading">Скачать JSON</button>
                <label class="import-file-picker editorial-import-btn">
                  <span class="import-file-button" x-text="editorialImportLoading ? 'Импорт…' : 'Загрузить JSON'"></span>
                  <input type="file" accept="application/json,.json" @change="importEditorialReviewFile($event)" :disabled="editorialImportLoading">
                </label>
              </div>
              <div class="editorial-filters">
                <label><input type="radio" value="review" x-model="editorialReviewFilter" @change="loadEditorialReview()"> К вычитке</label>
                <label><input type="radio" value="changed" x-model="editorialReviewFilter" @change="loadEditorialReview()"> Изменено</label>
                <label><input type="radio" value="pending" x-model="editorialReviewFilter" @change="loadEditorialReview()"> Ожидает</label>
                <label><input type="radio" value="queue" x-model="editorialReviewFilter" @change="loadEditorialReview()"> Очередь</label>
                <label><input type="radio" value="added" x-model="editorialReviewFilter" @change="loadEditorialReview()"> Новое</label>
                <label><input type="radio" value="removed" x-model="editorialReviewFilter" @change="loadEditorialReview()"> Удалено</label>
                <label><input type="radio" value="all" x-model="editorialReviewFilter" @change="loadEditorialReview()"> Все</label>
                <input type="search" placeholder="Поиск id / title / фраза" x-model="editorialReviewSearch" @keydown.enter="loadEditorialReview()" class="editorial-search">
                <button type="button" @click="loadEditorialReview()">Найти</button>
              </div>
              <p class="muted" x-show="editorialReview">Записей: <span x-text="editorialReview.total"></span></p>
              <div class="editorial-table-wrap" x-show="editorialReview?.records?.length">
                <table class="editorial-table">
                  <thead>
                    <tr>
                      <th>ID / фраза</th>
                      <th>Опубликовано</th>
                      <th>Черновик</th>
                      <th>Название (правка)</th>
                      <th>Описание (правка)</th>
                      <th>Статус</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="row in editorialReview.records" :key="row.command_id">
                      <tr>
                        <td class="editorial-id">
                          <code x-text="row.command_id"></code>
                          <span class="muted editorial-phrase" x-text="row.phrase_example"></span>
                          <div class="editorial-reasons">
                            <template x-for="r in row.reasons" :key="r">
                              <span class="diff-badge" :class="'reason-' + r" x-text="reasonLabel(r)"></span>
                            </template>
                          </div>
                        </td>
                        <td class="editorial-snap">
                          <span x-text="row.published?.title_ru || '—'"></span>
                          <span class="muted" x-text="row.published?.effect_description_ru"></span>
                        </td>
                        <td class="editorial-snap">
                          <span x-text="row.draft?.title_ru || '—'"></span>
                          <span class="muted" x-text="row.draft?.effect_description_ru"></span>
                        </td>
                        <td><input type="text" x-model="row.edit.title_ru" class="editorial-input"></td>
                        <td><textarea rows="2" x-model="row.edit.effect_description_ru" class="editorial-textarea"></textarea></td>
                        <td>
                          <select x-model="row.edit.status" class="editorial-select">
                            <option value="approved">approved — в draft</option>
                            <option value="pending">pending — не в draft</option>
                            <option value="ai_draft">ai_draft</option>
                            <option value="rejected">rejected — не в draft</option>
                          </select>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <p class="muted" x-show="editorialReview && !editorialReviewLoading && editorialReview.total === 0">Нет записей по фильтру.</p>
            </li>

            <li class="wizard-step wizard-step-collapsed">
              <details>
                <summary class="step-head step-head-summary">
                  <span class="step-num">·</span>
                  <h2>Legacy: очередь по одной записи</h2>
                </summary>
              <p class="muted">Устаревший путь approve/dismiss через prompt. Используйте редактор текстов выше. Оставлено для аварийных случаев.</p>
              <div class="actions">
                <button type="button" @click="loadContentQueue()" :disabled="contentQueueLoading">Обновить очередь</button>
              </div>
              <p class="muted" x-show="contentQueueLoading">Загрузка…</p>
              <p class="muted" x-show="!contentQueueLoading && contentQueue.length === 0">Очередь пуста.</p>
              <div class="import-diff" x-show="contentQueue.length > 0">
                <template x-for="item in contentQueue.slice(0, 30)" :key="item.id">
                  <div class="import-diff-item queue-item">
                    <p>
                      <span class="diff-badge diff-added" x-text="queueEventLabel(item.event_type)"></span>
                      <code x-text="item.command_id"></code>
                      <span x-text="item.phrase || ''"></span>
                    </p>
                    <p class="muted" x-show="item.suggested_effect" x-text="item.suggested_effect"></p>
                    <div class="actions">
                      <button type="button" class="primary" @click="approveQueueItem(item)"
                        x-show="item.event_type === 'new_command' || item.event_type === 'needs_review'">Одобрить</button>
                      <button type="button" @click="dismissQueueItem(item)">Скрыть</button>
                    </div>
                  </div>
                </template>
              </div>
              </details>
            </li>

            <li class="wizard-step" :class="{'step-active': pipeline?.hasUnpublishedChanges}">
              <div class="step-head">
                <span class="step-num">4</span>
                <h2>Diff: draft vs опубликованное</h2>
              </div>
              <p class="muted">Сравнение draft bundle с текущим live bundle — то, что изменится у пользователей app после публикации.</p>
              <div class="actions">
                <button type="button" class="primary" @click="loadDraftDiff(true, { resetFilters: true })"
                  :disabled="pipelineDiffLoading || !serverStatus.online"
                  x-text="pipelineDiffLoading ? 'Загрузка…' : (pipelineDiff ? 'Обновить diff' : 'Показать diff draft vs опубликованное')"></button>
                <button type="button" @click="view='import'">Импорт bundle с диска</button>
              </div>

              <div class="import-diff" x-show="pipelineDiff">
                <p class="import-diff-summary" x-show="diffSummaryText(pipelineDiff)" x-text="diffSummaryText(pipelineDiff)"></p>
                <div class="import-diff-filters">
                  <label><input type="radio" value="all" x-model="pipelineDiffFilter"> Все</label>
                  <label><input type="radio" value="added" x-model="pipelineDiffFilter"> Добавлено</label>
                  <label><input type="radio" value="changed" x-model="pipelineDiffFilter"> Изменено</label>
                  <label><input type="radio" value="removed" x-model="pipelineDiffFilter"> Удалено</label>
                  <label class="import-needs-review"><input type="checkbox" x-model="pipelineDiffNeedsReviewOnly"> только needs_review</label>
                </div>
                <template x-for="sec in diffSections(pipelineDiff)" :key="'pipe-' + sec.key">
                  <div class="import-diff-block" x-show="filteredDiffItems(sec.section, 'pipeline').length > 0">
                    <p><strong x-text="sec.label"></strong>:
                      +<span x-text="sec.section.summary.added"></span> /
                      ~<span x-text="sec.section.summary.changed"></span> /
                      −<span x-text="sec.section.summary.removed"></span>
                    </p>
                    <template x-for="item in filteredDiffItems(sec.section, 'pipeline').slice(0, 40)" :key="item.id + item.change">
                      <details class="import-diff-item">
                        <summary>
                          <span class="diff-badge" :class="'diff-' + item.change" x-text="changeLabel(item.change)"></span>
                          <code x-text="item.id"></code>
                          <span x-text="item.title_ru || ''"></span>
                          <span class="muted" x-show="(item.tags || []).includes('needs_review')">needs_review</span>
                        </summary>
                        <ul class="import-field-diffs" x-show="diffFieldEntries(item).length">
                          <template x-for="fd in diffFieldEntries(item)" :key="fd.field">
                            <li><strong x-text="fd.field"></strong>:
                              <span class="diff-old" x-text="fd.old"></span> →
                              <span class="diff-new" x-text="fd.new"></span>
                            </li>
                          </template>
                        </ul>
                      </details>
                    </template>
                    <p class="muted" x-show="filteredDiffItems(sec.section, 'pipeline').length > 40">
                      … ещё <span x-text="filteredDiffItems(sec.section, 'pipeline').length - 40"></span> — сузьте фильтр
                    </p>
                  </div>
                </template>
                <p class="muted" x-show="pipelineDiff && !pipelineDiffHasVisibleItems()">Нет изменений по выбранному фильтру.</p>
              </div>
            </li>

            <li class="wizard-step">
              <div class="step-head">
                <span class="step-num">5</span>
                <h2>Публикация</h2>
              </div>
              <p x-show="pipeline?.draft?.needsReviewCount > 0" class="import-warning">
                В draft <span x-text="pipeline.draft.needsReviewCount"></span> команд с needs_review — желательно вычитать перед prod.
              </p>
              <div class="actions">
                <button type="button" class="primary" @click="view='publish'; loadHistory()"
                  :disabled="!pipeline?.hasUnpublishedChanges">Перейти к публикации draft → live</button>
                <button type="button" @click="openAdminGuide()">Инструкция (скопировать путь)</button>
                <button type="button" @click="copyText('.\\' + (pipeline?.verifyScript || 'scripts/verify-staging.ps1'))">Скрипт verify-staging</button>
              </div>
              <p class="muted">Prod — только по <code>RUNBOOK-PUBLISH.md</code> после проверки Android staging.</p>
            </li>
          </ol>

          <div class="card" x-show="pipeline && !pipelineLoading">
            <h2>Seed на сервере (опционально)</h2>
            <p class="muted">Если на VPS лежит готовый JSON — можно импортировать без push с ПК.</p>
            <template x-if="pipeline?.seed?.exists">
              <p>
                <code x-text="pipeline.seed.path"></code>
                · <span x-text="formatBytes(pipeline.seed.sizeBytes || 0)"></span>
                · изменён <span x-text="pipeline.seed.lastModified"></span>
              </p>
              <div class="actions">
                <button class="primary" @click="importSeedFromServer('merge')" :disabled="seedImportLoading || !serverStatus.online"
                  x-text="seedImportLoading ? 'Импорт…' : 'Импорт seed → draft (merge)'"></button>
                <button @click="importSeedFromServer('replace')" :disabled="seedImportLoading || !serverStatus.online">Заменить всё</button>
              </div>
            </template>
            <template x-if="pipeline && !pipeline?.seed?.exists">
              <p class="muted">
                Seed не найден
                <span x-show="pipeline?.seed?.path"> (<code x-text="pipeline.seed.path"></code>)</span>.
                Используйте ярлык «1. Обновить каталог» с ПК.
              </p>
            </template>
          </div>
        </section>

        <section x-show="view==='feedback'">
          <h1>Отзывы пользователей</h1>
          <div class="editorial-filters">
            <label><input type="radio" value="open" x-model="feedbackFilter" @change="loadFeedback()"> Открытые</label>
            <label><input type="radio" value="resolved" x-model="feedbackFilter" @change="loadFeedback()"> Закрытые</label>
            <label><input type="radio" value="dismissed" x-model="feedbackFilter" @change="loadFeedback()"> Отклонённые</label>
            <label><input type="radio" value="" x-model="feedbackFilter" @change="loadFeedback()"> Все</label>
            <input type="search" placeholder="Поиск…" x-model="feedbackSearch" @keydown.enter.prevent="loadFeedback()">
            <button type="button" @click="loadFeedback()">Обновить</button>
          </div>
          <p class="muted" x-show="feedbackLoading">Загрузка…</p>
          <div class="editorial-table-wrap" x-show="!feedbackLoading">
            <table class="editorial-table">
              <thead>
                <tr>
                  <th>Дата</th>
                  <th>Статус</th>
                  <th>Rating</th>
                  <th>Сообщение</th>
                  <th>App</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="item in feedbackItems" :key="item.id">
                  <tr>
                    <td x-text="formatLastCheck(item.created_at)"></td>
                    <td><span class="diff-badge" :class="'status-' + item.status" x-text="item.status"></span></td>
                    <td x-text="item.rating ?? '—'"></td>
                    <td>
                      <details>
                        <summary x-text="item.message.length > 80 ? item.message.slice(0, 80) + '…' : item.message"></summary>
                        <p x-text="item.message"></p>
                      </details>
                    </td>
                    <td>
                      <span x-text="item.app_version || '—'"></span>
                      <span class="muted" x-show="item.platform"> · <span x-text="item.platform"></span></span>
                      <span class="muted" x-show="item.content_version"> · v<span x-text="item.content_version"></span></span>
                    </td>
                    <td>
                      <button x-show="item.status === 'open'" @click="resolveFeedback(item)">Закрыть</button>
                      <button class="danger" x-show="item.status === 'open'" @click="dismissFeedback(item)">Отклонить</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <p class="muted" x-show="!feedbackItems.length">Нет обращений</p>
          </div>
        </section>

        <section x-show="view==='command-reports'">
          <h1>Ошибки в командах</h1>
          <div class="editorial-filters">
            <label><input type="radio" value="open" x-model="commandReportsFilter" @change="loadCommandReports()"> Открытые</label>
            <label><input type="radio" value="resolved" x-model="commandReportsFilter" @change="loadCommandReports()"> Закрытые</label>
            <label><input type="radio" value="dismissed" x-model="commandReportsFilter" @change="loadCommandReports()"> Отклонённые</label>
            <label><input type="radio" value="" x-model="commandReportsFilter" @change="loadCommandReports()"> Все</label>
            <input type="search" placeholder="command_id / текст…" x-model="commandReportsSearch" @keydown.enter.prevent="loadCommandReports()">
            <button type="button" @click="loadCommandReports()">Обновить</button>
          </div>
          <p class="muted" x-show="commandReportsLoading">Загрузка…</p>
          <div class="editorial-table-wrap" x-show="!commandReportsLoading">
            <table class="editorial-table">
              <thead>
                <tr>
                  <th>Дата</th>
                  <th>Command</th>
                  <th>Тип</th>
                  <th>Контекст</th>
                  <th>Статус</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="item in commandReports" :key="item.id">
                  <tr>
                    <td x-text="formatLastCheck(item.created_at)"></td>
                    <td>
                      <code x-text="item.command_id"></code>
                      <span class="muted" x-show="!item.command_exists_current"> · stale</span>
                    </td>
                    <td x-text="issueTypeLabel(item.issue_type)"></td>
                    <td>
                      <p x-show="item.command_title" x-text="item.command_title"></p>
                      <p class="muted" x-show="item.phrase_used" x-text="item.phrase_used"></p>
                      <details x-show="item.message">
                        <summary>Комментарий</summary>
                        <p x-text="item.message"></p>
                      </details>
                      <span class="muted" x-show="item.content_version">content v<span x-text="item.content_version"></span></span>
                    </td>
                    <td><span class="diff-badge" :class="'status-' + item.status" x-text="item.status"></span></td>
                    <td>
                      <button type="button" @click="openCommandFromReport(item)">Команда</button>
                      <button x-show="item.status === 'open'" @click="resolveCommandReport(item)">Закрыть</button>
                      <button class="danger" x-show="item.status === 'open'" @click="dismissCommandReport(item)">Отклонить</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <p class="muted" x-show="!commandReports.length">Нет сообщений</p>
          </div>
        </section>

        <section x-show="view==='api'" x-init="loadApiDocs()">
          <h1>Справка API</h1>
          <p class="muted" x-show="apiDocs?.baseUrl">Base URL: <code x-text="apiDocs.baseUrl"></code></p>
          <p class="muted">Session cookie: <code>alice_admin_session</code>. Public endpoints — без auth.</p>
          <p class="muted" x-show="apiDocsLoading">Загрузка…</p>
          <template x-for="section in apiDocs?.sections || []" :key="section.title">
            <div class="card api-section">
              <h2 x-text="section.title"></h2>
              <p class="muted" x-show="section.description" x-text="section.description"></p>
              <template x-for="ep in section.endpoints" :key="ep.method + ep.path">
                <details class="api-endpoint">
                  <summary>
                    <span class="http-method" :class="'method-' + ep.method.toLowerCase()" x-text="ep.method"></span>
                    <code x-text="ep.path"></code>
                    <span class="muted" x-text="ep.summary"></span>
                    <span class="auth-badge" x-show="!ep.auth">public</span>
                  </summary>
                  <div class="api-endpoint-body">
                    <p x-show="ep.body"><strong>Body:</strong> <code x-text="ep.body"></code></p>
                    <p x-show="ep.response"><strong>Response:</strong> <code x-text="ep.response"></code></p>
                  </div>
                </details>
              </template>
            </div>
          </template>
        </section>

        <p class="toast" x-show="toast" x-text="toast"></p>
        <p class="error" x-show="error" x-text="error"></p>
      </main>
    </div>
  </template>

  <script src="/admin/js/admin.js?v=13"></script>
</body>
</html>
