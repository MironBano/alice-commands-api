# Local dev — PostgreSQL only (Ktor runs on host via Gradle after implementation)
services:
  postgres:
    image: postgres:16-alpine
    container_name: alice-commands-db
    environment:
      POSTGRES_DB: alice_commands
      POSTGRES_USER: alice
      POSTGRES_PASSWORD: alice_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alice -d alice_commands"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
