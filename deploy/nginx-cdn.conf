# Static CDN for category icons — DNS only (no Cloudflare proxy), accessible from RU without VPN.
# Files: /opt/alice-api/storage/icons/v1/*.svg

server {
    listen 80;
    server_name cdn.alicecommands.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cdn.alicecommands.ru;

    ssl_certificate /etc/letsencrypt/live/cdn.alicecommands.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.alicecommands.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/alice-api/storage;
    access_log /var/log/nginx/cdn-icons-access.log;
    error_log /var/log/nginx/cdn-icons-error.log;

    location /icons/v1/ {
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
