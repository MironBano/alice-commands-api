# Bootstrap: HTTP only until Let's Encrypt cert is issued (see deploy-staging.ps1).
server {
    listen 80;
    server_name cdn.alicecommands.ru;

    root /opt/alice-api/storage;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /icons/v1/ {
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
