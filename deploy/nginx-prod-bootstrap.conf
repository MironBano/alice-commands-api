# HTTP-only bootstrap for api.alicecommands.ru until certbot issues TLS cert
server {
    listen 80;
    server_name api.alicecommands.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 200 'alice-api prod bootstrap';
        add_header Content-Type text/plain;
    }
}
