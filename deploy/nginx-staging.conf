# Staging reverse proxy — HTTPS (Let's Encrypt) + stable proxy for VPN/Cloudflare/large imports
upstream alice_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name staging-api.alicecommands.ru;

    # Must be a location: a server-level `return` runs before locations and breaks renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging-api.alicecommands.ru;

    ssl_certificate /etc/letsencrypt/live/staging-api.alicecommands.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.alicecommands.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    client_max_body_size 64m;
    client_body_buffer_size 128k;

    location = /privacy {
        default_type text/html;
        alias /opt/alice-api/storage/legal/privacy.html;
        add_header Cache-Control "public, max-age=300";
    }

    location /legal/ {
        alias /opt/alice-api/storage/legal/;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /icons/ {
        alias /opt/alice-api/storage/icons/;
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location /devices/ {
        alias /opt/alice-api/storage/devices/;
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        proxy_pass http://alice_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
