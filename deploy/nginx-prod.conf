# Production API — HTTPS (Let's Encrypt) + proxy to alice-api-prod :8081
upstream alice_api_prod {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name api.alicecommands.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.alicecommands.ru;

    ssl_certificate /etc/letsencrypt/live/api.alicecommands.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.alicecommands.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;
    client_body_buffer_size 128k;

    location /icons/ {
        alias /opt/alice-api/storage/icons/;
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location /devices/ {
        alias /opt/alice-api/storage/devices/;
        add_header Cache-Control "public, max-age=86400, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        proxy_pass http://alice_api_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
