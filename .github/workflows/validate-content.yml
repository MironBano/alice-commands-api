name: Validate content

on:
  pull_request:
    paths:
      - 'seed/**'
      - 'schema/**'
      - 'server/**'
  push:
    branches: [main]
    paths:
      - 'seed/**'
      - 'schema/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate against JSON Schema
        run: |
          ./gradlew :server:validateContent -PcontentFile=seed/catalog-audit-fixed.json --no-daemon
          ./gradlew :server:validateSmartHomeDevices --no-daemon
          ./gradlew :server:test --no-daemon
