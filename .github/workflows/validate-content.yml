name: Validate content

on:
  pull_request:
    paths:
      - 'seed/**'
      - 'tools/content/**'
      - 'schema/**'
      - 'server/**'
  push:
    branches: [main]
    paths:
      - 'seed/**'
      - 'tools/content/**'
      - 'schema/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r tools/content/requirements.txt

      - name: Build bundle (cached sources)
        run: python tools/content/build_bundle.py --skip-fetch

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate against JSON Schema
        run: ./gradlew :server:validateContent -PcontentFile=seed/full-catalog.json --no-daemon
