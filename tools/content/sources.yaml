# Content sources — whitelist + optional discovery (assist-only inventory).
rate_limit_seconds: 1.0
user_agent: "AliceCommandsContentBot/1.0 (assist-only; +https://github.com/MironBano/alice-commands-api)"

# Discovery adds skill pages from overview. Excluded paths: device-control UI, not voice commands.
discovery:
  enabled: true
  overview_url: https://alice.yandex.ru/support/ru/station/skills/

# Paths excluded from discovery (navigation / device UI, not command tables)
discovery_exclude_paths:
  - /support/ru/station/alice-controls
  - /support/ru/station/skills/alice-controls
  - /support/ru/station/skills/lamp
  - /support/ru/station/skills/socket
  - /support/ru/station/skills/ir-remote
  - /support/ru/station/skills/hdmi
  - /support/ru/station/skills/tv

sources:
  - id: yandex_quick_commands
    priority: backup
    url: https://alice.yandex.ru/support/ru/station/start/quick-commands
    parser: yandex_quick_commands
    category_id: quick_commands

  - id: pilot_smart_home
    priority: primary
    url: file://seed/integration-smart-home.json
    parser: pilot_json
    category_id: smart_home
