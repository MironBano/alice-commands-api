  <h2>Активировать режим «Играй везде»</h2>
  <p>Скажите: «Алиса, включи музыку везде».</p>
  <h2>Выключить режим «Играй везде»</h2>
  <p>«Алиса, останови музыку в <strong>гостиной</strong>».</p>
  <p>Командами «Сначала», «Дальше», «Предыдущая песня».</p>
